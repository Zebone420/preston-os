name: ECC P0 Lock Refresh

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  refresh-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Refresh dashboard lockfile without scripts
        working-directory: apps/dashboard
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Refresh guards lockfile without scripts
        working-directory: packages/guards
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload refreshed lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: ecc-p0-refreshed-lockfiles
          path: |
            apps/dashboard/package-lock.json
            packages/guards/package-lock.json
          if-no-files-found: error
          retention-days: 1
