name: ECC P0 Lock Refresh

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  refresh-locks:
    if: github.head_ref == 'integration/ecc-p0-capability-pack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/ecc-p0-capability-pack
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Refresh dashboard lockfile without scripts
        working-directory: apps/dashboard
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Refresh guards lockfile without scripts
        working-directory: packages/guards
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only generated lockfiles
        shell: bash
        run: |
          if git diff --quiet -- apps/dashboard/package-lock.json packages/guards/package-lock.json; then
            echo "Lockfiles already current"
            exit 0
          fi
          git config user.name "Preston ECC P0 Lock Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/dashboard/package-lock.json packages/guards/package-lock.json
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "2"
          git commit -m "fix(deps): refresh lockfiles for security patches"
          git push origin HEAD:integration/ecc-p0-capability-pack
