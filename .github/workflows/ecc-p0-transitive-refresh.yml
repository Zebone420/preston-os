name: ECC P0 Transitive Security Refresh

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  refresh-transitives:
    if: github.head_ref == 'integration/ecc-p0-capability-pack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/ecc-p0-capability-pack
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Update only vulnerable transitive lock entries
        working-directory: apps/dashboard
        run: >-
          npm update --package-lock-only --ignore-scripts --no-audit --no-fund
          baseline-browser-mapping brace-expansion browserslist fast-uri hono js-yaml qs
      - name: Commit dashboard lockfile only
        shell: bash
        run: |
          if git diff --quiet -- apps/dashboard/package-lock.json; then
            echo "No transitive lock change required"
            exit 0
          fi
          git config user.name "Preston ECC P0 Lock Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/dashboard/package-lock.json
          test "$(git diff --cached --name-only)" = "apps/dashboard/package-lock.json"
          git commit -m "fix(deps): refresh vulnerable transitive packages"
          git push origin HEAD:integration/ecc-p0-capability-pack
