name: SkillSpector Staging Audit

on:
  push:
    branches:
      - feature/skillspector-staging-audit
  workflow_dispatch:

concurrency:
  group: skillspector-staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  skillspector-static-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out Preston
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned SkillSpector
        run: >-
          python -m pip install
          "https://github.com/NVIDIA/SkillSpector/releases/download/v2.11.2/skillspector-2.11.2-py3-none-any.whl#sha256=9e0eb261d63e7ae92f94177a44aeb8fef5e0ceeaa4d09135780baf94cbc420ec"

      - name: Verify SkillSpector version
        run: skillspector --version

      - name: Scan Preston without LLM analysis
        id: scan
        shell: bash
        run: |
          set +e

          # Full-repository pass is useful, but bounded so unusual source trees cannot stall CI.
          timeout 180s skillspector scan . --no-llm --format json --output skillspector-report.json
          repo_rc=$?
          echo "repo_scan_exit_code=${repo_rc}" >> "$GITHUB_OUTPUT"

          # Always scan the highest-value agent/control surfaces independently as fallback evidence.
          targets=(
            "CLAUDE.md"
            "WORKER_CONTEXT.md"
            "apps/dashboard/AGENTS.md"
            "integrations"
          )

          for target in "${targets[@]}"; do
            if [[ -e "$target" ]]; then
              safe_name=$(printf '%s' "$target" | tr '/.' '__')
              timeout 90s skillspector scan "$target" --no-llm --format json --output "skillspector-target-${safe_name}.json"
              rc=$?
              printf '%s=%s\n' "$safe_name" "$rc" >> skillspector-target-status.txt
            fi
          done

          exit 0

      - name: Record scan status
        shell: bash
        run: |
          echo "### SkillSpector staging audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- SkillSpector: v2.11.2 (release wheel hash pinned)" >> "$GITHUB_STEP_SUMMARY"
          echo "- LLM analysis: disabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full-repository exit code: ${{ steps.scan.outputs.repo_scan_exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full-repository scan bound: 180 seconds" >> "$GITHUB_STEP_SUMMARY"
          echo "- Independent agent/control surfaces: CLAUDE.md, WORKER_CONTEXT.md, apps/dashboard/AGENTS.md, integrations/" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f skillspector-target-status.txt ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat skillspector-target-status.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload SkillSpector reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillspector-preston-staging-report
          path: |
            skillspector-report.json
            skillspector-target-*.json
            skillspector-target-status.txt
          if-no-files-found: warn
          retention-days: 14
