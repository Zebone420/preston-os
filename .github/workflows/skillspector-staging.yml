name: SkillSpector Staging Audit

on:
  push:
    branches:
      - feature/skillspector-staging-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skillspector-static-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Preston
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned SkillSpector
        run: >-
          python -m pip install
          "https://github.com/NVIDIA/SkillSpector/releases/download/v2.11.2/skillspector-2.11.2-py3-none-any.whl#sha256=9e0eb261d63e7ae92f94177a44aeb8fef5e0ceeaa4d09135780baf94cbc420ec"

      - name: Verify SkillSpector version
        run: skillspector --version

      - name: Scan Preston without LLM analysis
        id: scan
        shell: bash
        run: |
          set +e
          skillspector scan . --no-llm --format json --output skillspector-report.json
          scan_rc=$?
          echo "scan_exit_code=${scan_rc}" >> "$GITHUB_OUTPUT"

          skillspector scan . --no-llm --format markdown --output skillspector-report.md
          markdown_rc=$?
          echo "markdown_exit_code=${markdown_rc}" >> "$GITHUB_OUTPUT"

          # Preserve reports for review even when findings cause a non-zero scanner exit.
          exit 0

      - name: Record scan status
        shell: bash
        run: |
          echo "### SkillSpector staging audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- SkillSpector: v2.11.2" >> "$GITHUB_STEP_SUMMARY"
          echo "- LLM analysis: disabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- JSON scan exit code: ${{ steps.scan.outputs.scan_exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Markdown scan exit code: ${{ steps.scan.outputs.markdown_exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scope: repository root" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SkillSpector reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillspector-preston-staging-report
          path: |
            skillspector-report.json
            skillspector-report.md
          if-no-files-found: error
          retention-days: 14
