name: CI

# Lint, typecheck, run dependency security gates, and execute guard + dashboard
# test suites on every push and PR to master. Read-only: no secrets, no deploys,
# no live connectors.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  guards:
    name: guards (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/guards
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Dependency audit — block high/critical
        run: npm audit --audit-level=high
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test

  dashboard:
    name: dashboard (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Dependency audit — block high/critical
        run: npm audit --audit-level=high
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
