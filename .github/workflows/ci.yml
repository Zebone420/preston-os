name: CI

# Security audit, lint, typecheck, OS-runtime build, and full tests on every
# push and PR to master. Read-only: no secrets, deploys, or live connectors.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  guards:
    name: guards (security + typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/guards
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Dependency audit — block high/critical
        run: npm audit --audit-level=high
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test

  brain-bridge:
    name: brain bridge (audit + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/brain-bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install from pinned manifest and generate lock
        run: npm install --ignore-scripts
      - name: Capture generated Brain Bridge lockfile
        uses: actions/upload-artifact@v4
        with:
          name: brain-bridge-lock
          path: packages/brain-bridge/package-lock.json
          if-no-files-found: error
      - name: Dependency audit — block high/critical
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  dashboard:
    name: dashboard (security + lint + typecheck + runtime build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Dependency audit — block high/critical
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run build:os-runtime
      - run: npm test
