name: Final Candidate Lock Refresh

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  refresh-locks:
    if: github.head_ref == 'integration/phase1-ecc-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/phase1-ecc-final
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Refresh dashboard lockfile without scripts
        working-directory: apps/dashboard
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm update --package-lock-only --ignore-scripts --no-audit --no-fund baseline-browser-mapping brace-expansion browserslist fast-uri hono js-yaml qs
      - name: Refresh guards lockfile without scripts
        working-directory: packages/guards
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfiles only
        shell: bash
        run: |
          if git diff --quiet -- apps/dashboard/package-lock.json packages/guards/package-lock.json; then
            echo "No lockfile changes required"
            exit 0
          fi
          git config user.name "Preston Final Lock Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/dashboard/package-lock.json packages/guards/package-lock.json
          unexpected="$(git diff --cached --name-only | grep -Ev '^(apps/dashboard/package-lock.json|packages/guards/package-lock.json)$' || true)"
          test -z "$unexpected"
          git commit -m "fix(deps): refresh final candidate lockfiles"
          git push origin HEAD:integration/phase1-ecc-final
